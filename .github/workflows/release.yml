name: Package TycoonConsole

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Package Windows source files
        run: |
          mkdir -p dist
          zip -r dist/TycoonConsole-Source.zip TycoonConsole.ps1 Start-TycoonConsole.bat README.md config/defaults.ini

      - name: Publish rolling release for the in-app updater
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: console-latest
          name: TycoonConsole Latest
          make_latest: true
          prerelease: false
          draft: false
          files: dist/TycoonConsole-Source.zip
          fail_on_unmatched_files: true

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/TycoonConsole-Source.zip
          fail_on_unmatched_files: true
