name: Package TycoonConsole

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Package Windows source files
        run: |
          mkdir -p dist
          zip -j dist/TycoonConsole-Source.zip TycoonConsole.ps1 Start-TycoonConsole.bat README.md

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/TycoonConsole-Source.zip
